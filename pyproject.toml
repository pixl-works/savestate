[project]
name = "savestate-memory"
version = "0.1.1"
description = "A small, self-maintaining state card on top of any agent memory system, for facts that change over time."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/pixl-works/savestate"
Source = "https://github.com/pixl-works/savestate"
Issues = "https://github.com/pixl-works/savestate/issues"

[project.optional-dependencies]
honcho = ["honcho-ai==2.2.0"]
local = ["sentence-transformers>=3.3"]

[project.scripts]
savestate = "savestate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savestate"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls a real LLM through the local proxy (opt in with: pytest -m live)"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
